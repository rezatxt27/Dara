# A release for every version: when extension/manifest.json changes on main (or on a manual run from the
# Actions tab), run the tests and publish a release, with its zip and notes, for each version that has none yet.
name: Release

on:
  push:
    branches: [main]
    paths: ['extension/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/release/publish.sh
